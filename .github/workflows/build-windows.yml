name: Build Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install pyinstaller tkinterdnd2

      - name: Build GUNTER.exe
        shell: pwsh
        run: ./build_exe.ps1

      - name: Assemble release folder
        shell: pwsh
        run: ./make_alpha_release.ps1 -OutDir release/GUNTER

      - name: Zip release
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          Compress-Archive -Path release/GUNTER/* -DestinationPath "GUNTER-$version-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: GUNTER-windows
          path: GUNTER-*-windows.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GUNTER-*-windows.zip
          prerelease: true
