name: Build Windows release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install pyinstaller tkinterdnd2

      - name: Build GUNTER.exe
        shell: pwsh
        run: ./build_exe.ps1

      - name: Assemble release folder
        shell: pwsh
        run: ./make_alpha_release.ps1 -OutDir release/GUNTER

      - name: Test install / uninstall keeps player data
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installDir = Join-Path $env:LOCALAPPDATA "GUNTER"
          ./release/GUNTER/scripts/install_support.ps1 -Quiet -NoDesktopShortcut
          if (-not (Test-Path "$installDir/GUNTER.exe")) { throw "Install did not produce GUNTER.exe" }

          # Fake player data, as the app would write it
          New-Item -ItemType Directory -Force "$installDir/profiles" | Out-Null
          Set-Content "$installDir/profiles/default.json" '{"TestStamp": true}'
          Set-Content "$installDir/settings.json" '{"active_profile_id": "default"}'

          ./release/GUNTER/scripts/uninstall_support.ps1 -Quiet

          if (Test-Path "$installDir/GUNTER.exe") { throw "Uninstall left GUNTER.exe behind" }
          if (-not (Test-Path "$installDir/profiles/default.json")) { throw "Uninstall deleted player profiles" }
          if (-not (Test-Path "$installDir/settings.json")) { throw "Uninstall deleted settings.json" }
          $backups = Join-Path ([Environment]::GetFolderPath("MyDocuments")) "GUNTER Backups"
          if (-not (Get-ChildItem -Recurse "$backups" -Filter default.json)) { throw "No backup of profiles was made" }

          # Reinstall over the kept data, then a full wipe with -RemoveUserData
          ./release/GUNTER/scripts/install_support.ps1 -Quiet -NoDesktopShortcut
          if (-not (Test-Path "$installDir/profiles/default.json")) { throw "Reinstall lost player profiles" }
          ./release/GUNTER/scripts/uninstall_support.ps1 -Quiet -RemoveUserData
          if (Test-Path $installDir) { throw "-RemoveUserData left $installDir behind" }
          Write-Host "Install/uninstall test passed"

      - name: Zip release
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          Compress-Archive -Path release/GUNTER/* -DestinationPath "GUNTER-$version-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: GUNTER-windows
          path: GUNTER-*-windows.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GUNTER-*-windows.zip
          prerelease: true
